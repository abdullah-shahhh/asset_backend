services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-uamp_main}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override host-dependent vars from .env — inside the compose network
      # the DB and cache are reachable by service name, not localhost.
      DB_HOST: postgres
      TENANT_DB_HOST: postgres
      REDIS_URL: redis://redis:6379
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      - uploads:/app/src/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  uploads:
